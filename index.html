<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="ComBats - a lane auto-battler by Jeff and Lewis" />
  <title>ComBats</title>

  <!-- PLAY IT LIKE AN APP (2026-10-17). "Add to Home Screen" on a phone or
       tablet installs ComBats with its own icon, and it then opens full
       screen, sideways, with none of the browser's bars eating the picture.
       The manifest says that for Android; the apple-* lines say it for iPhone
       and iPad, which read these instead. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#150f2b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ComBats" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />

  <!-- A tiny inline bat icon, so the browser does not ask for /favicon.ico
       (which would be a harmless but noisy 404 in the console). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='7' fill='%236fd3ff'/%3E%3Cpath d='M9 16 L1 10 L3 21 Z' fill='%236fd3ff'/%3E%3Cpath d='M23 16 L31 10 L29 21 Z' fill='%236fd3ff'/%3E%3Ccircle cx='13' cy='17' r='2' fill='%23fff'/%3E%3Ccircle cx='19' cy='17' r='2' fill='%23fff'/%3E%3C/svg%3E" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #150f2b;
      overflow: hidden;
      /* Stop a finger-drag from scrolling or zooming the page while playing,
         and a drag down from the top from reloading it (pull-to-refresh). */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      /* No "Save Image" menu on a long press, and no grey flash on each tap. */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* The game fills the screen MINUS the phone's safe areas: the notch or
       camera cut-out, the rounded corners, and the home-indicator bar along
       the bottom, which would otherwise sit on top of the bat buttons and
       turn a tap into "go to the home screen". On a computer every inset is
       0 and this is simply the whole window. Phaser sizes the game to fit
       this box (Scale.FIT in src/main.js). */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
    }

    /* ---------------------------------------------------------------
       ComBats is a wide game, so on a phone held upright it shrinks
       to a thin strip. This asks the player to turn the phone sideways.
       It is pure CSS - the game keeps running underneath, so turning the
       phone back just uncovers it.
       --------------------------------------------------------------- */
    #rotate-hint {
      display: none;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-hint {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #150f2b;
        color: #ffd24a;
        font-family: Verdana, Geneva, sans-serif;
        font-size: 20px;
        text-align: center;
        padding: 24px;
      }

      #rotate-hint .phone {
        width: 54px;
        height: 92px;
        border: 4px solid #ffd24a;
        border-radius: 10px;
        animation: tip 1.6s ease-in-out infinite;
      }
    }

    @keyframes tip {
      0%, 40%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="rotate-hint">
    <div class="phone"></div>
    <div>Turn your phone sideways to play ComBats</div>
  </div>

  <!-- =====================================================================
       SCRIPT ORDER MATTERS. Each file puts something on 'window', and later
       files use what earlier files put there. Top to bottom:

         1. the engine
         2. the data (the numbers Lewis edits)
         3. the systems (rules)
         4. the entities (things on screen)
         5. the scenes (screens)
         6. main.js, which starts the game

       If you add a new file, add its <script> tag in the right group.
       ===================================================================== -->

  <!-- 1. Engine: Phaser 4.2.1, MIT licence, kept in /vendor so the game
          never depends on the internet at run time. -->
  <script src="vendor/phaser.min.js"></script>

  <!-- 2. Data - ALL the tuning numbers live here -->
  <script src="data/config.js"></script>
  <script src="data/units.js"></script>
  <script src="data/levels.js"></script>
  <script src="data/items.js"></script>
  <script src="data/backgrounds.js"></script>

  <!-- 3. Systems -->
  <script src="src/systems/economy.js"></script>
  <script src="src/systems/pool.js"></script>
  <script src="src/systems/combat.js"></script>
  <script src="src/systems/spawner.js"></script>
  <script src="src/systems/necro.js"></script>
  <script src="src/systems/sting.js"></script>
  <script src="src/systems/items.js"></script>
  <script src="src/systems/squad.js"></script>
  <script src="src/systems/cheer.js"></script>
  <script src="src/systems/frost.js"></script>
  <script src="src/systems/bomb.js"></script>
  <script src="src/systems/rabies.js"></script>
  <script src="src/systems/engineer.js"></script>
  <script src="src/systems/brain.js"></script>
  <script src="src/systems/caves.js"></script>
  <script src="src/systems/team.js"></script>
  <script src="src/systems/progress.js"></script>
  <script src="src/systems/touch.js"></script>

  <!-- 4. Entities -->
  <script src="src/entities/unit.js"></script>
  <script src="src/entities/base.js"></script>

  <!-- 5. Scenes -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/LockerScene.js"></script>
  <script src="src/scenes/BattleScene.js"></script>

  <!-- 6. Start the game -->
  <script src="src/main.js"></script>

</body>
</html>
